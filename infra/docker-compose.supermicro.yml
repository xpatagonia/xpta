version: "3.8"

services:
  # 1. Backend Node de xpatagonia.online (API + CyberPanel IMAP/SMTP + Proxies OSRM/n8n)
  xpatagonia-api:
    image: node:22-alpine
    container_name: xpatagonia-api
    working_dir: /app
    volumes:
      - ../:/app
    command: sh -c "npm ci --omit=dev && npm run build && NODE_ENV=production npm start"
    env_file:
      - ../.env
    environment:
      - PORT=3000
      - OSRM_BASE_URL=http://osrm-argentina:5000
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/xpatagonia
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - xpatagonia_net

  # 2. Motor de Ruteo Open Source OSRM (Mapa Argentina compilado sin depender de Google Maps)
  # Nota: Compilar primero argentina-latest.osm.pbf en disco con osrm-extract / osrm-partition / osrm-customize
  osrm-argentina:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: osrm-argentina
    volumes:
      - ./osrm-data:/data
    # En Supermicro 16GB RAM puedes quitar --mmap para máxima velocidad en RAM pura (<10ms)
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/argentina-latest.osrm
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - xpatagonia_net

  # 3. Motor de Optimización de Flotas y Consolidación LTL (VROOM sobre OSRM)
  vroom-patagonia:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    container_name: vroom-patagonia
    ports:
      - "3005:3000"
    environment:
      - VROOM_ROUTER=osrm
    depends_on:
      - osrm-argentina
    restart: unless-stopped
    networks:
      - xpatagonia_net

  # 4. Orquestador de Flujos n8n (Conecta Supabase <-> Supermicro <-> Odoo VPS <-> Telegram/WhatsApp)
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-xpatagonia
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=flujos.xpatagonia.online
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://flujos.xpatagonia.online/
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - xpatagonia_net

  # 5. Cloudflare Tunnel (Expone api, rutas y flujos.xpatagonia.online sin abrir puertos del router)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-xpatagonia
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - xpatagonia_net

volumes:
  n8n_data:

networks:
  xpatagonia_net:
    driver: bridge
